[project]
name = "pstryk-ai"
version = "0.1.0"
description = "Pstryk AI – Energy Intelligence & Optimization for Home Assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::RuntimeWarning:homeassistant"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.coverage.run]
source = ["custom_components/pstryk_ai"]
