name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.13 resolves an older Home Assistant (2026.2.x), 3.14 the current one.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: python scripts/gen_translations.py && git diff --exit-code custom_components/pstryk_ai/strings.json custom_components/pstryk_ai/translations
      - run: python -m pytest --cov --cov-report=term
