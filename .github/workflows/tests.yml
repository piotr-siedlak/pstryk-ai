name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: python scripts/gen_translations.py && git diff --exit-code custom_components/pstryk_ai/strings.json custom_components/pstryk_ai/translations
      - run: python -m pytest --cov --cov-report=term
