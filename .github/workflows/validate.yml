name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
  hacs:
    # The HACS action (and HACS itself) only works with public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
